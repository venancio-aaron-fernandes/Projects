<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="stylesheet" href="profile_card.css">
</head>
<body>
    <div class="card">
        <h1 class="element">Profile</h1>
        <img src="profile.jpg" alt="Profile Picture" element>
        <h2 class="element">Venancio Fernandes</h2>
        <h3 class="element">Software Engineer</h3>
        <p class="element">Tech Enthusiast with a passion for creating Software for solving problems. Open for Hiring.</p>
        <h3 class="skills-header">Skills</h3>
        <div class="skills element">
            <button class="skill">Java</button>
            <button class="skill">Html</button>
            <button class="skill">CSS</button>
        </div>
        <button class="hire-button element">Hire Me</button>
    </div>
</body>
</html>
